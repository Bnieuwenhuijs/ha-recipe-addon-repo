name: "Recipe Parser"
version: "1.0.1"
slug: "recipe_parser"
description: "Haalt ingrediënten op van receptpagina's (o.a. voedingscentrum.nl) via een REST endpoint, voor gebruik in Home Assistant scripts richting Bring."
url: "https://www.voedingscentrum.nl"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
ports:
  5001/tcp: 5001
ports_description:
  5001/tcp: "Recipe parser API (GET /parse?url=...)"
